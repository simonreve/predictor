# nginx config for the React frontend
# Proxies /api requests to the backend, serves React app for all other routes

server {
    listen 80;

    location /api/ {
        proxy_pass http://backend:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        # Required for React Router — send all non-asset requests to index.html
        try_files $uri $uri/ /index.html;
    }
}
