version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: world_cup_db_staging
    environment:
      POSTGRES_USER: predictor_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: world_cup_2026_staging
    volumes:
      - postgres_data_staging:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U predictor_user -d world_cup_2026_staging"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: world_cup_backend_staging
    environment:
      DATABASE_URL: postgresql://predictor_user:${POSTGRES_PASSWORD}@db:5432/world_cup_2026_staging
      BACKEND_PORT: 3001
      FOOTBALL_API_KEY: ${FOOTBALL_API_KEY}
      AUTH_SECRET: ${AUTH_SECRET}
      NODE_ENV: staging
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: world_cup_frontend_staging
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

  caddy:
    image: caddy:2-alpine
    container_name: world_cup_caddy_staging
    restart: unless-stopped
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data_staging:/data
      - caddy_config_staging:/config
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data_staging:
  caddy_data_staging:
  caddy_config_staging:
