version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: world_cup_db
    environment:
      POSTGRES_USER: predictor_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: world_cup_2026
    # No public port — backend reaches db:5432 on the internal Docker network
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U predictor_user -d world_cup_2026"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: world_cup_backend
    environment:
      DATABASE_URL: postgresql://predictor_user:${POSTGRES_PASSWORD}@db:5432/world_cup_2026
      BACKEND_PORT: 3001
      FOOTBALL_API_KEY: ${FOOTBALL_API_KEY}
      AUTH_SECRET: ${AUTH_SECRET}
      NODE_ENV: ${NODE_ENV:-production}
    # No public port — Caddy reaches backend:3001 on the internal Docker network
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: world_cup_frontend
    # No public port — Caddy proxies to frontend:80 on the internal Docker network
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

  caddy:
    image: caddy:2-alpine
    container_name: world_cup_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
